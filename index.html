<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA — Digital Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    min-height: 100vh;
    transition: background .5s ease;
}

/* =========================
   THEMES
========================= */

body.gaming {
    background:
        radial-gradient(circle at 20% 10%, #24106e, transparent 35%),
        radial-gradient(circle at 80% 10%, #006eff, transparent 30%),
        #05050c;
}

body.ott {
    background:
        radial-gradient(circle at 20% 10%, #680914, transparent 35%),
        radial-gradient(circle at 80% 10%, #e50914, transparent 30%),
        #080506;
}

/* =========================
   HEADER
========================= */

header {
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5,5,15,.85);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 2px;
}

.gaming .logo {
    color: #4de1ff;
}

.ott .logo {
    color: #ff3545;
}

nav {
    display: flex;
    gap: 8px;
}

.nav-btn {
    border: none;
    padding: 11px 20px;
    border-radius: 25px;
    color: white;
    background: rgba(255,255,255,.07);
    cursor: pointer;
    font-weight: bold;
    transition: .25s;
}

.nav-btn:hover {
    transform: translateY(-2px);
}

.nav-btn.active {
    background: white;
    color: #111;
}

/* =========================
   MAIN
========================= */

main {
    width: 86%;
    max-width: 1250px;
    margin: auto;
}

.hero {
    text-align: center;
    padding: 70px 10px 35px;
}

.hero h1 {
    font-size: clamp(40px,7vw,75px);
    font-weight: 900;
    margin-bottom: 18px;
}

.gaming .hero h1 {
    background: linear-gradient(90deg,#55eaff,#7467ff);
    -webkit-background-clip: text;
    color: transparent;
}

.ott .hero h1 {
    background: linear-gradient(90deg,#ff3340,#ff8a00);
    -webkit-background-clip: text;
    color: transparent;
}

.hero p {
    color: #aaa;
    font-size: 17px;
}

.section-title {
    font-size: 30px;
    margin: 25px 0;
}

/* =========================
   SEARCH
========================= */

.search {
    width: 100%;
    padding: 16px 20px;
    margin: 15px 0 30px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.12);
    outline: none;
    background: rgba(255,255,255,.07);
    color: white;
    font-size: 16px;
}

.search::placeholder {
    color: #888;
}

/* =========================
   PRODUCTS
========================= */

.products {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 20px;
    padding-bottom: 80px;
}

.card {
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255,255,255,.06);
    transition: .3s;
    cursor: pointer;
}

.card:hover {
    transform: translateY(-8px);
    border-color: rgba(255,255,255,.35);
}

.poster {
    height: 230px;
    display: flex;
    align-items: flex-end;
    padding: 18px;
    position: relative;
    background-size: cover;
    background-position: center;
}

.poster-title {
    font-size: 21px;
    font-weight: 900;
    text-shadow: 0 2px 8px black;
    position: relative;
    z-index: 2;
}

.card-content {
    padding: 18px;
}

.card-content p {
    color: #999;
    font-size: 13px;
    min-height: 38px;
}

.price {
    font-size: 21px;
    font-weight: bold;
    margin: 15px 0;
}

.buy {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    background: white;
    color: #111;
    transition: .2s;
}

.buy:hover {
    transform: scale(1.03);
}

/* =========================
   OTT MAIN OPTION
========================= */

.ott-main-card {
    max-width: 500px;
    margin: 20px auto 80px;
}

.ott-main-poster {
    height: 280px;
    display: flex;
    align-items: flex-end;
    padding: 25px;
    border-radius: 22px 22px 0 0;
    background:
        linear-gradient(to top,rgba(0,0,0,.95),transparent 65%),
        radial-gradient(circle at 70% 30%,#ff2939,#5c0610 45%,#120307);
}

.ott-main-poster h2 {
    font-size: 30px;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(8px);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-box {
    width: 100%;
    max-width: 480px;
    background: #11121c;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 22px;
    padding: 30px;
    text-align: center;
    animation: pop .25s ease;
}

.modal-box h2 {
    margin-bottom: 12px;
}

.modal-box p {
    color: #aaa;
    line-height: 1.5;
    margin-bottom: 15px;
}

.modal-price {
    font-size: 25px;
    font-weight: bold;
    margin: 20px;
}

.purchase {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #4de1ff;
    color: #061018;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
}

.ott .purchase {
    background: #ff3949;
    color: white;
}

.close {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #292936;
    color: white;
    cursor: pointer;
}

@keyframes pop {
    from {
        transform: scale(.8);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 35px;
    border-top: 1px solid rgba(255,255,255,.08);
    color: #777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px) {
    .products {
        grid-template-columns: repeat(2,1fr);
    }
}

@media(max-width:600px) {

    header {
        flex-direction: column;
        gap: 15px;
    }

    nav {
        width: 100%;
        justify-content: center;
    }

    main {
        width: 92%;
    }

    .products {
        grid-template-columns: 1fr;
    }
}
</style>
</head>


<body class="gaming">

<header>

    <div class="logo">NEXORA</div>

    <nav>

        <button
            class="nav-btn active"
            onclick="changeTab('gaming')">
            🎮 Gaming
        </button>

        <button
            class="nav-btn"
            onclick="changeTab('ott')">
            📺 OTT
        </button>

    </nav>

</header>


<main>

<section class="hero">

    <h1 id="heroTitle">
        GAME STORE
    </h1>

    <p id="heroText">
        Popular games and digital gaming products in one place.
    </p>

</section>


<!-- =========================
     GAMING
========================= -->

<div id="gamingSection">

    <h2 class="section-title">
        🔥 Popular Games
    </h2>

    <input
        class="search"
        id="gameSearch"
        placeholder="Search games..."
        onkeyup="searchGames()"
    >

    <section
        class="products"
        id="games">
    </section>

</div>


<!-- =========================
     OTT
========================= -->

<div
    id="ottSection"
    style="display:none;">

    <!-- ONE OTT OPTION -->

    <div
        id="ottMainOption"
        class="ott-main-card card"
        onclick="showOTTPlatforms()">

        <div class="ott-main-poster">

            <h2>
                📺 Streaming Subscriptions
            </h2>

        </div>

        <div class="card-content">

            <p>
                Browse available streaming platforms
                and subscription options.
            </p>

            <div class="price">
                View Platforms
            </div>

            <button
                class="buy"
                onclick="event.stopPropagation(); showOTTPlatforms()">

                EXPLORE OTT

            </button>

        </div>

    </div>


    <!-- OTT PLATFORMS -->

    <div
        id="ottPlatforms"
        style="display:none;">

        <h2 class="section-title">
            🍿 Choose Your Platform
        </h2>

        <input
            class="search"
            id="ottSearch"
            placeholder="Search OTT platforms..."
            onkeyup="searchOTT()"
        >

        <section
            class="products"
            id="ottProducts">
        </section>

    </div>

</div>

</main>


<footer>
    © 2026 NEXORA — Digital Store
</footer>


<!-- =========================
     PURCHASE MODAL
========================= -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <h2 id="modalTitle">
            Product
        </h2>

        <p id="modalDescription">
            Product information.
        </p>

        <div
            class="modal-price"
            id="modalPrice">
            ₹999
        </div>

        <button
            class="purchase"
            onclick="purchase()">

            PURCHASE NOW

        </button>

        <button
            class="close"
            onclick="closeModal()">

            CLOSE

        </button>

    </div>

</div>


<script>

/* =========================
   GAMES
========================= */

const games = [

{
name:"Grand Theft Auto V",
price:"₹999",
description:"Open-world action adventure."
},

{
name:"Red Dead Redemption 2",
price:"₹1,299",
description:"Epic open-world western adventure."
},

{
name:"Cyberpunk 2077",
price:"₹1,499",
description:"Open-world futuristic RPG."
},

{
name:"Minecraft",
price:"₹999",
description:"Build, explore and survive."
},

{
name:"Marvel's Spider-Man Remastered",
price:"₹1,499",
description:"Open-world superhero action."
},

{
name:"Marvel's Spider-Man: Miles Morales",
price:"₹1,299",
description:"Play as Miles Morales."
},

{
name:"Hogwarts Legacy",
price:"₹1,499",
description:"Open-world magical adventure."
},

{
name:"EA SPORTS FC 26",
price:"₹2,999",
description:"Football simulation game."
},

{
name:"Forza Horizon 5",
price:"₹1,499",
description:"Open-world racing experience."
},

{
name:"God of War Ragnarök",
price:"₹2,999",
description:"Epic Norse mythology adventure."
},

{
name:"Elden Ring",
price:"₹2,499",
description:"Massive fantasy action RPG."
},

{
name:"Assassin's Creed Shadows",
price:"₹2,999",
description:"Action adventure set in feudal Japan."
},

{
name:"Resident Evil 4",
price:"₹1,499",
description:"Survival horror action game."
},

{
name:"Watch Dogs 2",
price:"₹999",
description:"Open-world hacking adventure."
},

{
name:"Far Cry 6",
price:"₹1,499",
description:"Open-world action adventure."
},

{
name:"The Witcher 3",
price:"₹999",
description:"Massive fantasy RPG adventure."
}

];


/* =========================
   OTT PLATFORMS
========================= */

const ottPlatforms = [

{
name:"Netflix",
price:"Choose Plan",
description:"Streaming entertainment subscription.",
color:"#b20710"
},

{
name:"Prime Video",
price:"Choose Plan",
description:"Movies, series and entertainment.",
color:"#087ea4"
},

{
name:"JioHotstar",
price:"Choose Plan",
description:"Movies, shows and sports streaming.",
color:"#1464d2"
},

{
name:"SonyLIV",
price:"Choose Plan",
description:"Entertainment, sports and originals.",
color:"#172b91"
},

{
name:"ZEE5",
price:"Choose Plan",
description:"Movies, shows and regional entertainment.",
color:"#6c16a8"
},

{
name:"Crunchyroll",
price:"Choose Plan",
description:"Anime streaming subscription.",
color:"#f47521"
},

{
name:"Apple TV+",
price:"Choose Plan",
description:"Apple original movies and series.",
color:"#222222"
},

{
name:"YouTube Premium",
price:"Choose Plan",
description:"YouTube Premium subscription.",
color:"#ff0033"
},

{
name:"Lionsgate Play",
price:"Choose Plan",
description:"Movies and premium series.",
color:"#5316a3"
},

{
name:"Discovery+",
price:"Choose Plan",
description:"Documentaries and factual entertainment.",
color:"#1677c8"
},

{
name:"hoichoi",
price:"Choose Plan",
description:"Bengali movies and original series.",
color:"#e52b3b"
},

{
name:"Sun NXT",
price:"Choose Plan",
description:"South Indian entertainment.",
color:"#ed7d00"
}

];


/* =========================
   RENDER GAMES
========================= */

function renderGames(list = games) {

    const container =
        document.getElementById("games");

    container.innerHTML = "";

    list.forEach((game,index) => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.onclick = () =>
            openModal(game);

        card.innerHTML = `

            <div
                class="poster"
                style="
                background:
                linear-gradient(
                    to top,
                    rgba(0,0,0,.95),
                    transparent 65%
                ),
                linear-gradient(
                    ${120 + index * 7}deg,
                    #111827,
                    #2563eb,
                    #312e81
                );
                ">

                <div class="poster-title">
                    ${game.name}
                </div>

            </div>

            <div class="card-content">

                <p>
                    ${game.description}
                </p>

                <div class="price">
                    ${game.price}
                </div>

                <button
                    class="buy"
                    onclick="
                    event.stopPropagation();
                    openModal(games[${index}])
                    ">

                    PURCHASE NOW

                </button>

            </div>
        `;

        container.appendChild(card);

    });
}


/* =========================
   SEARCH GAMES
========================= */

function searchGames() {

    const query =
        document
        .getElementById("gameSearch")
        .value
        .toLowerCase();

    const filtered =
        games.filter(game =>
            game.name
            .toLowerCase()
            .includes(query)
        );

    renderGames(filtered);
}


/* =========================
   SHOW OTT PLATFORMS
========================= */

function showOTTPlatforms() {

    document
        .getElementById("ottMainOption")
        .style.display = "none";

    document
        .getElementById("ottPlatforms")
        .style.display = "block";

    renderOTT();

}


/* =========================
   RENDER OTT
========================= */

function renderOTT(list = ottPlatforms) {

    const container =
        document.getElementById("ottProducts");

    container.innerHTML = "";

    list.forEach((platform,index) => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.onclick = () =>
            openModal(platform);

        card.innerHTML = `

            <div
                class="poster"
                style="
                background:
                linear-gradient(
                    to top,
                    rgba(0,0,0,.95),
                    transparent 60%
                ),
                linear-gradient(
                    135deg,
                    ${platform.color},
                    #111
                );
                ">

                <div class="poster-title">
                    ${platform.name}
                </div>

            </div>

            <div class="card-content">

                <p>
                    ${platform.description}
                </p>

                <div class="price">
                    ${platform.price}
                </div>

                <button
                    class="buy"
                    onclick="
                    event.stopPropagation();
                    openModal(ottPlatforms[${index}])
                    ">

                    PURCHASE NOW

                </button>

            </div>

        `;

        container.appendChild(card);

    });
}


/* =========================
   SEARCH OTT
========================= */

function searchOTT() {

    const query =
        document
        .getElementById("ottSearch")
        .value
        .toLowerCase();

    const filtered =
        ottPlatforms.filter(platform =>
            platform.name
            .toLowerCase()
            .includes(query)
        );

    renderOTT(filtered);
}


/* =========================
   TAB SWITCHING
========================= */

function changeTab(tab) {

    document.body.classList.remove(
        "gaming",
        "ott"
    );

    document.body.classList.add(tab);

    document
        .querySelectorAll(".nav-btn")
        .forEach(button =>
            button.classList.remove("active")
        );


    if(tab === "gaming") {

        document
            .querySelectorAll(".nav-btn")[0]
            .classList.add("active");

        document
            .getElementById("gamingSection")
            .style.display = "block";

        document
            .getElementById("ottSection")
            .style.display = "none";

        document
            .getElementById("heroTitle")
            .textContent = "GAME STORE";

        document
            .getElementById("heroText")
            .textContent =
            "Popular games and digital gaming products in one place.";

    }


    if(tab === "ott") {

        document
            .querySelectorAll(".nav-btn")[1]
            .classList.add("active");

        document
            .getElementById("gamingSection")
            .style.display = "none";

        document
            .getElementById("ottSection")
            .style.display = "block";

        document
            .getElementById("heroTitle")
            .textContent =
            "STREAMING SUBSCRIPTIONS";

        document
            .getElementById("heroText")
            .textContent =
            "Choose your preferred entertainment platform.";

    }

}


/* =========================
   MODAL
========================= */

function openModal(product) {

    document
        .getElementById("modalTitle")
        .textContent = product.name;

    document
        .getElementById("modalDescription")
        .textContent =
        product.description;

    document
        .getElementById("modalPrice")
        .textContent =
        product.price;

    document
        .getElementById("modal")
        .style.display = "flex";

}


function closeModal() {

    document
        .getElementById("modal")
        .style.display = "none";

}


function purchase() {

    alert(
        "Purchase selected!\n\n" +
        "Secure checkout will be connected in the next step."
    );

}


/* =========================
   INITIAL LOAD
========================= */

renderGames();

</script>

</body>
</html>
