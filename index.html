<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA — Digital Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #070711;
    color: white;
    min-height: 100vh;
    transition: background 0.5s ease;
}

/* =========================
   HEADER
========================= */

header {
    width: 100%;
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5,5,15,0.85);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #48d9ff;
}

nav {
    display: flex;
    gap: 8px;
}

.nav-btn {
    border: none;
    padding: 11px 18px;
    border-radius: 25px;
    color: white;
    background: rgba(255,255,255,0.07);
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.nav-btn:hover {
    transform: translateY(-2px);
}

.nav-btn.active {
    background: white;
    color: #111;
}

/* =========================
   MAIN
========================= */

main {
    width: 86%;
    max-width: 1250px;
    margin: auto;
}

.hero {
    text-align: center;
    padding: 90px 10px 55px;
    animation: fadeIn 0.5s ease;
}

.hero h1 {
    font-size: clamp(40px, 7vw, 78px);
    line-height: 1;
    font-weight: 900;
    margin-bottom: 20px;
}

.hero p {
    color: #b9b9c8;
    font-size: 18px;
    max-width: 650px;
    margin: auto;
}

/* =========================
   SEARCH
========================= */

.search-area {
    display: flex;
    justify-content: center;
    margin-bottom: 35px;
}

.search {
    width: 100%;
    max-width: 600px;
    padding: 16px 20px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.12);
    outline: none;
    background: rgba(255,255,255,0.06);
    color: white;
    font-size: 16px;
}

.search::placeholder {
    color: #888;
}

/* =========================
   PRODUCTS
========================= */

.products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    padding-bottom: 80px;
}

.card {
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 22px;
    padding: 28px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(15px);
    transition: 0.35s;
    position: relative;
    overflow: hidden;
}

.card:hover {
    transform: translateY(-8px);
    border-color: rgba(255,255,255,0.3);
}

.icon {
    font-size: 42px;
    margin-bottom: 20px;
}

.card h3 {
    font-size: 22px;
    margin-bottom: 10px;
}

.card p {
    color: #aaaaba;
    min-height: 45px;
    line-height: 1.5;
}

.price {
    font-size: 24px;
    font-weight: 900;
    margin: 22px 0;
}

.buy {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 12px;
    background: white;
    color: #111;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
}

.buy:hover {
    transform: scale(1.03);
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 35px;
    border-top: 1px solid rgba(255,255,255,0.08);
    color: #777;
}

/* =========================
   THEMES
========================= */

body.gaming {
    background:
        radial-gradient(circle at 20% 20%, #21106b 0%, transparent 35%),
        radial-gradient(circle at 80% 20%, #006dff 0%, transparent 30%),
        #05050c;
}

body.gaming .logo {
    color: #4de1ff;
}

body.gaming .hero h1 {
    background: linear-gradient(90deg,#55eaff,#7467ff);
    -webkit-background-clip: text;
    color: transparent;
}

body.gaming .card {
    background: linear-gradient(
        145deg,
        rgba(78,57,190,.25),
        rgba(12,30,70,.35)
    );
}


/* OTT */

body.ott {
    background:
        radial-gradient(circle at 20% 20%, #6d0715 0%, transparent 35%),
        radial-gradient(circle at 80% 20%, #e50914 0%, transparent 30%),
        #080506;
}

body.ott .logo {
    color: #ff3b47;
}

body.ott .hero h1 {
    background: linear-gradient(90deg,#ff3340,#ff8a00);
    -webkit-background-clip: text;
    color: transparent;
}

body.ott .card {
    background: linear-gradient(
        145deg,
        rgba(130,10,20,.35),
        rgba(45,10,15,.4)
    );
}


/* SERVICES */

body.services {
    background:
        radial-gradient(circle at 20% 20%, #075e4f 0%, transparent 35%),
        radial-gradient(circle at 80% 20%, #008b72 0%, transparent 30%),
        #030909;
}

body.services .logo {
    color: #3cffc5;
}

body.services .hero h1 {
    background: linear-gradient(90deg,#36ffd0,#48a7ff);
    -webkit-background-clip: text;
    color: transparent;
}

body.services .card {
    background: linear-gradient(
        145deg,
        rgba(0,130,110,.25),
        rgba(5,40,40,.4)
    );
}


/* =========================
   ANIMATION
========================= */

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.fade {
    animation: fadeIn 0.45s ease;
}


/* =========================
   MOBILE
========================= */

@media(max-width: 800px) {

    header {
        padding: 18px 4%;
        flex-direction: column;
        gap: 15px;
    }

    nav {
        width: 100%;
        justify-content: center;
    }

    .nav-btn {
        padding: 10px 12px;
        font-size: 13px;
    }

    main {
        width: 92%;
    }

    .hero {
        padding-top: 60px;
    }

    .products {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body class="gaming">

<header>

    <div class="logo">NEXORA</div>

    <nav>
        <button class="nav-btn active" onclick="changeTab('gaming')">
            🎮 Gaming
        </button>

        <button class="nav-btn" onclick="changeTab('ott')">
            📺 OTT
        </button>

        <button class="nav-btn" onclick="changeTab('services')">
            🛠️ Services
        </button>
    </nav>

</header>


<main>

<section class="hero">

    <h1 id="heroTitle">
        LEVEL UP YOUR GAMING
    </h1>

    <p id="heroText">
        Digital gaming products and legitimate game-related services in one place.
    </p>

</section>


<div class="search-area">

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search products..."
        onkeyup="searchProducts()"
    >

</div>


<section class="products" id="products"></section>

</main>


<footer>
    © 2026 NEXORA — Digital Store
</footer>


<script>

const data = {

    gaming: {

        title: "LEVEL UP YOUR GAMING",

        description:
        "Digital gaming products and legitimate game-related services in one place.",

        products: [

            {
                icon: "🎮",
                name: "Game Store",
                description: "Digital games and legitimate game-related purchases.",
                price: "₹99"
            },

            {
                icon: "🕹️",
                name: "Gaming Services",
                description: "Gaming-related digital services and support.",
                price: "₹49"
            },

            {
                icon: "🎁",
                name: "Gaming Gift Cards",
                description: "Authorized digital gift cards and gaming credits.",
                price: "₹100"
            },

            {
                icon: "💎",
                name: "Game Credits",
                description: "Purchase credits for supported games.",
                price: "₹99"
            },

            {
                icon: "🏆",
                name: "Tournament Entry",
                description: "Digital tournament and gaming event access.",
                price: "₹49"
            },

            {
                icon: "🎨",
                name: "Gaming Graphics",
                description: "Custom gaming banners, thumbnails and artwork.",
                price: "₹149"
            }

        ]

    },


    ott: {

        title: "YOUR ENTERTAINMENT HUB",

        description:
        "Browse authorized streaming subscriptions and digital entertainment services.",

        products: [

            {
                icon: "📺",
                name: "Streaming Subscription",
                description: "Authorized streaming subscription plans.",
                price: "₹149"
            },

            {
                icon: "🎬",
                name: "Movie & Series Pack",
                description: "Digital entertainment packages from authorized providers.",
                price: "₹199"
            },

            {
                icon: "🍿",
                name: "Entertainment Pack",
                description: "Choose from available entertainment services.",
                price: "₹249"
            },

            {
                icon: "🎥",
                name: "Premium Entertainment",
                description: "Premium authorized streaming options.",
                price: "₹299"
            },

            {
                icon: "👨‍👩‍👧‍👦",
                name: "Family Plan",
                description: "Eligible family subscription options.",
                price: "₹399"
            },

            {
                icon: "⭐",
                name: "Entertainment Support",
                description: "Help choosing and setting up supported services.",
                price: "₹49"
            }

        ]

    },


    services: {

        title: "DIGITAL SERVICES",

        description:
        "Creative and digital services to help your online presence grow.",

        products: [

            {
                icon: "🎨",
                name: "Social Media Design",
                description: "Professional posts, banners and social graphics.",
                price: "₹99"
            },

            {
                icon: "🖼️",
                name: "Thumbnail Design",
                description: "Custom thumbnails for YouTube and social platforms.",
                price: "₹79"
            },

            {
                icon: "🎬",
                name: "Video Editing",
                description: "Short-form video editing for social media.",
                price: "₹199"
            },

            {
                icon: "✍️",
                name: "Caption & Copy",
                description: "Captions and promotional copy for your content.",
                price: "₹49"
            },

            {
                icon: "🚀",
                name: "Social Media Promotion",
                description: "Legitimate promotional strategies for your content.",
                price: "₹149"
            },

            {
                icon: "💻",
                name: "Website Design",
                description: "Simple websites and landing pages for businesses.",
                price: "₹499"
            }

        ]

    }

};


let currentTab = "gaming";


function changeTab(tab) {

    currentTab = tab;

    const body = document.body;

    body.classList.remove("gaming");
    body.classList.remove("ott");
    body.classList.remove("services");

    body.classList.add(tab);

    document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    if(tab === "gaming") {
        document.querySelectorAll(".nav-btn")[0].classList.add("active");
    }

    if(tab === "ott") {
        document.querySelectorAll(".nav-btn")[1].classList.add("active");
    }

    if(tab === "services") {
        document.querySelectorAll(".nav-btn")[2].classList.add("active");
    }

    document.getElementById("heroTitle").textContent =
        data[tab].title;

    document.getElementById("heroText").textContent =
        data[tab].description;

    document.getElementById("search").value = "";

    renderProducts(data[tab].products);
}


function renderProducts(products) {

    const container = document.getElementById("products");

    container.innerHTML = "";

    products.forEach(product => {

        const card = document.createElement("div");

        card.className = "card fade";

        card.innerHTML = `

            <div class="icon">
                ${product.icon}
            </div>

            <h3>
                ${product.name}
            </h3>

            <p>
                ${product.description}
            </p>

            <div class="price">
                From ${product.price}
            </div>

            <button
                class="buy"
                onclick="buyProduct('${product.name}')"
            >
                Buy Now
            </button>

        `;

        container.appendChild(card);

    });

}


function searchProducts() {

    const query =
        document.getElementById("search").value.toLowerCase();

    const products =
        data[currentTab].products.filter(product =>

            product.name.toLowerCase().includes(query) ||

            product.description.toLowerCase().includes(query)

        );

    renderProducts(products);

}


function buyProduct(name) {

    alert(
        "You selected: " +
        name +
        "\n\nThe secure checkout system will be added next."
    );

}


/* Load Gaming page initially */

renderProducts(data.gaming.products);

</script>

</body>
</html>
